appId: at.mfreimueller.grdr
productName: Grader
directories:
  buildResources: assets
  output: dist
icon: assets/icon.png
files:
  - build/**/*
  - '!build/plugins/**'
  - assets/**/*
  # Bundled grading skills are copied into a workspace, which cannot be done from inside the asar archive.
  - '!assets/gradeflow/**'
  - package.json
# The Agent SDK runs the Claude Code binary of its per-platform package; a binary cannot be executed from
# inside the asar archive, so those packages are unpacked (the SDK's JavaScript stays in the asar).
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
# Bundled plugins are served from disk, not from inside the asar archive.
extraResources:
  - from: build/plugins
    to: plugins
  - from: assets/gradeflow/skills
    to: gradeflow/skills
afterSign: scripts/afterSign.js
mac:
  target:
    - dmg
    - zip
win:
  target:
    - nsis
  # Only the Windows Claude Code binary belongs into the installer (the build container also has the Linux one).
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-{darwin,linux}-*/**'
linux:
  category: Education
  target:
    - deb
    - AppImage
publish:
  provider: generic
  url: https://mfreimueller.com/grader/updates/
