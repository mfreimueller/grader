appId: at.mfreimueller.grdr
productName: Grader
directories:
  buildResources: assets
  output: dist
icon: assets/icon.png
files:
  - build/**/*
  - '!build/plugins/**'
  - assets/**/*
  - package.json
# Bundled plugins are served from disk, not from inside the asar archive.
extraResources:
  - from: build/plugins
    to: plugins
afterSign: scripts/afterSign.js
mac:
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Education
  target:
    - deb
    - AppImage
publish:
  provider: generic
  url: https://mfreimueller.com/grader/updates/
